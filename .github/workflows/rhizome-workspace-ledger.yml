name: Rhizome Workspace ledger

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: rhizome-workspace-ledger-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DST_RUSTFLAGS: --cfg dst --cfg tokio_unstable --cfg io_uring_skip_arch_check

jobs:
  hygiene:
    name: Rust 1.98 format and clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zerofs
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
      - name: Check Foundation barrier evidence scripts
        run: |
          bash -n scripts/run-rhizome-barrier-foundation.sh
          bash -n scripts/collect-rhizome-barrier-foundation.sh
          bash -n scripts/verify-rhizome-barrier-sealed-retry.sh
          shellcheck scripts/run-rhizome-barrier-foundation.sh scripts/collect-rhizome-barrier-foundation.sh scripts/verify-rhizome-barrier-sealed-retry.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p zerofs --features rhizome-export-authority-core --all-targets -- -D warnings
      - run: cargo clippy -p zerofs --features rhizome-workspace-genesis-core --all-targets -- -D warnings
      - run: cargo clippy -p zerofs --features rhizome-workspace-barrier-core --all-targets -- -D warnings
      - run: RUSTFLAGS="$DST_RUSTFLAGS" cargo clippy --test dst -- -D warnings
      - run: RUSTFLAGS="$DST_RUSTFLAGS" cargo clippy -p zerofs --features rhizome-export-authority-core --test dst -- -D warnings
      - run: RUSTFLAGS="$DST_RUSTFLAGS" cargo clippy -p zerofs --features rhizome-workspace-genesis-core --test dst -- -D warnings
      - run: RUSTFLAGS="$DST_RUSTFLAGS" cargo clippy -p zerofs --features rhizome-workspace-barrier-core --test dst -- -D warnings

  tests:
    name: Rust 1.98 full and failpoint tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zerofs
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
      - run: cargo test
      - run: cargo test -p zerofs --features rhizome-export-authority-core --lib
      - run: cargo test -p zerofs --features rhizome-workspace-genesis-core --lib fs::workspace_genesis
      - run: cargo test -p zerofs --features rhizome-workspace-genesis-core --lib fs::export_authority::tests::genesis_activation_and_nbd_claim_share_one_guarded_authority_graph
      - run: cargo test -p zerofs --features rhizome-workspace-genesis-core --lib fs::key_codec::tests::genesis_namespace_is_disjoint_from_every_nbd_authority_subtype
      - run: cargo test -p zerofs --features 'rhizome-workspace-genesis-core failpoints' --lib fs::workspace_genesis
      - run: cargo test -p zerofs --features 'rhizome-workspace-barrier-core failpoints' --lib fs::workspace_barrier
      - run: cargo test -p zerofs-client --all-features
      - run: cargo test -p zerofs --features failpoints --lib workspace_operation
      - run: cargo test --features failpoints --test failpoints

  dst:
    name: Rust 1.98 deterministic simulation tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zerofs
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
      - run: RUSTFLAGS="$DST_RUSTFLAGS" cargo test --test dst
      - run: RUSTFLAGS="$DST_RUSTFLAGS" cargo test -p zerofs --features rhizome-export-authority-core --test dst export_authority_transition_model
      - run: RUSTFLAGS="$DST_RUSTFLAGS" cargo test -p zerofs --features rhizome-workspace-genesis-core --test dst workspace_genesis_codec_model
      - run: RUSTFLAGS="$DST_RUSTFLAGS" cargo test -p zerofs --features rhizome-workspace-barrier-core --test dst workspace_barrier_codec_model
      - run: RUSTFLAGS="$DST_RUSTFLAGS" cargo test --features failpoints --test dst crash_points
